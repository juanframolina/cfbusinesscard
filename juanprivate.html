<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #d6efff; /* Light blue background color */
        }
        .profile-card {
            max-width: 90%; /* Adjust as needed */
            margin: 0 auto; /* Centering the profile card horizontally */
            padding: 20px;
            background-color: #ffffff;
            border: 1px solid #b3d9f2;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .profile-photo {
            max-width: 251px; /* Adjust as needed */
            margin: 0 auto 20px;
            overflow: hidden;
        }
        .profile-photo img {
            width: 100%;
            height: auto;
            object-fit: cover;
        }
        .profile-details {
            text-align: center;
        }
        .profile-details h2 {
            margin: 10px 0;
            color: #333;
        }
        .profile-details p {
            margin: 5px 0;
            color: #666;
        }
        .profile-details a {
            color: #007bff;
        }
        .download-button {
            text-align: center;
            margin-top: 20px;
        }
        .download-button button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .download-button button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <div class="profile-photo">
            <img src="juanprivate.png" alt="Profile Photo">
        </div>
        <div class="profile-details">
            <h2>Juan Molina</h2>
            <p>Email: <a href="mailto:juanfra.molina@outlook.com">juanfra.molina@outlook.com</a></p>
            <p>Phone: <a href="tel:+447865342785">+447865342785</a></p>
            <p><a href="https://www.linkedin.com/in/juan-francisco-m-0519217/" target="_blank" rel="noopener" aria-label="LinkedIn profile"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="48" height="48"><path d="M29.63.001H2.362C1.06.001 0 1.034 0 2.306V29.69C0 30.965 1.06 32 2.362 32h27.27C30.937 32 32 30.965 32 29.69V2.306C32 1.034 30.937.001 29.63.001z" fill="#0177b5"/><path d="M4.745 11.997H9.5v15.27H4.745zm2.374-7.6c1.517 0 2.75 1.233 2.75 2.75S8.636 9.9 7.12 9.9a2.76 2.76 0 0 1-2.754-2.753 2.75 2.75 0 0 1 2.753-2.75m5.35 7.6h4.552v2.087h.063c.634-1.2 2.182-2.466 4.5-2.466 4.806 0 5.693 3.163 5.693 7.274v8.376h-4.743V19.84c0-1.77-.032-4.05-2.466-4.05-2.47 0-2.85 1.93-2.85 3.92v7.554h-4.742v-15.27z" fill="#fff"/></svg></a></p>
        </div>
    </div>
    <div class="download-button">
        <button onclick="downloadCard()">Download card</button>
    </div>

    <script>
        function downloadCard() {
            // Create a new anchor element
            var downloadLink = document.createElement('a');
            // Set the href attribute to the location of the file to be downloaded
            downloadLink.href = 'juanprivate.vcf';
            // Set the download attribute with the desired file name
            downloadLink.download = 'juanprivate.vcf';
            // Append the anchor element to the body
            document.body.appendChild(downloadLink);
            // Programmatically click the anchor element to trigger the download
            downloadLink.click();
            // Remove the anchor element from the body
            document.body.removeChild(downloadLink);
        }
    </script>
</body>
</html>
